services:
  - type: web
    name: lumia-backend
    env: node
    plan: free
    buildCommand: npm install && node scripts/migrator.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: lumia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true

databases:
  - name: lumia-db
    plan: free
