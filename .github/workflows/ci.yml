name: Meditrack CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite (API & Playwright E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meditrack_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      CI: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/meditrack_ci_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/meditrack_ci_test?sslmode=disable
      JWT_SECRET: ci_secret_jwt_key_min_32_characters_long_12345
      JWT_REFRESH_SECRET: ci_secret_jwt_refresh_min_32_characters_12345
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install backend dependencies
        run: |
          cd lumia-backend
          npm install

      - name: Install frontend dependencies
        run: |
          cd lumia-frontend
          npm install

      - name: Run Database Migrations & Seed Test DB
        run: |
          cd lumia-backend
          node scripts/deploy-init.js
          node scripts/reset-test-db.js

      - name: Run Backend API Test Suite (Jest + Supertest)
        run: |
          cd lumia-backend
          npm test

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright End-to-End Tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://meditrack-rouge.vercel.app

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14

